# Local stack: PostgreSQL + the landing page. Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elksa
      POSTGRES_PASSWORD: elksa
      POSTGRES_DB: elksa_landing
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elksa -d elksa_landing']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://elksa:elksa@db:5432/elksa_landing
      IP_HASH_SALT: ${IP_HASH_SALT:-change-me}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - '3000:3000'

volumes:
  pgdata:
